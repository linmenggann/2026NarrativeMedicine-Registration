<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大檔案上傳流程診斷</title>
<style>
  body{font-family:"Microsoft JhengHei",sans-serif;background:#f3f5f6;color:#22343a;margin:0;padding:20px;line-height:1.7}
  h1{font-size:1.25rem;margin:0 0 6px}
  .sub{color:#5d7178;font-size:.92rem;margin-bottom:16px}
  .env{background:#fff;border:1px solid #e4ebec;border-radius:10px;padding:12px 14px;font-size:.85rem;margin-bottom:16px;white-space:pre-wrap;word-break:break-all}
  .step{background:#fff;border:1px solid #e4ebec;border-left:6px solid #bbb;border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .step.ok{border-left-color:#0d7d7d;background:#e6f4f4}
  .step.err{border-left-color:#e9694a;background:#fbeae5}
  .step h2{font-size:1rem;margin:0 0 6px}
  .step .state{font-weight:800}
  .step pre{white-space:pre-wrap;word-break:break-all;background:#0f1f24;color:#cfe;padding:10px;border-radius:8px;font-size:.8rem;margin:8px 0 0;max-height:300px;overflow:auto}
  button{background:#0d7d7d;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:16px}
</style>
</head>
<body>
  <h1>🧪 大檔案上傳流程診斷</h1>
  <div class="sub">測試「直接上傳 Google Drive」整個流程，把每一步結果顯示在下方。請整頁截圖回傳。</div>
  <div class="env" id="env">環境資訊載入中…</div>
  <button id="rerun">重新測試</button>
  <div id="steps"></div>

<script>
  const URL_EXEC='https://script.google.com/macros/s/AKfycbx0mA3t-XvJ4j-M1zzfoGKnzBC-mMZNK7iuhN4QttUMP5hRsuNmlXxywBTcNmNKl9upWA/exec';
  const stepsEl=document.getElementById('steps');
  document.getElementById('env').textContent='網址：'+location.href+'\nprotocol：'+location.protocol+'　online：'+navigator.onLine+'\nUA：'+navigator.userAgent;

  function addStep(t){
    const d=document.createElement('div'); d.className='step';
    d.innerHTML='<h2>'+t+'</h2><div class="state">⏳ 測試中…</div><pre></pre>';
    stepsEl.appendChild(d);
    return { ok:x=>{d.className='step ok';d.querySelector('.state').textContent='✅ 成功';d.querySelector('pre').textContent=x;},
             err:x=>{d.className='step err';d.querySelector('.state').textContent='❌ 失敗';d.querySelector('pre').textContent=x;} };
  }
  function backend(obj){
    return fetch(URL_EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)}).then(r=>r.json());
  }

  async function run(){
    stepsEl.innerHTML='';
    const fileName='diag_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.txt';
    const blob=new Blob(['diagnostic upload content '+new Date().toISOString()],{type:'text/plain'});

    // ① initUpload
    const s1=addStep('① 向後端申請上傳網址 (initUpload)');
    let uploadUrl='';
    try{
      const out=await backend({action:'initUpload',category:'v',fileName:fileName,mimeType:'text/plain'});
      if(out.result==='success'&&out.uploadUrl){ uploadUrl=out.uploadUrl; s1.ok('成功取得上傳網址：\n'+uploadUrl.slice(0,120)+'…'); }
      else { s1.err(JSON.stringify(out)); return; }
    }catch(e){ s1.err(e.name+': '+e.message); return; }

    // ② 直接 PUT 到 Drive（逐事件記錄）
    const s2=addStep('② 直接上傳檔案到 Google Drive (XHR PUT)');
    const putResult=await new Promise(res=>{
      const log=[]; let uploaded=false;
      const xhr=new XMLHttpRequest();
      xhr.open('PUT',uploadUrl,true); xhr.timeout=120000;
      xhr.setRequestHeader('Content-Type','text/plain');
      xhr.upload.onprogress=ev=>log.push('upload.onprogress '+(ev.lengthComputable?Math.round(ev.loaded/ev.total*100)+'%':'(不可計)'));
      xhr.upload.onload=()=>{ uploaded=true; log.push('✓ upload.onload（檔案已完整送出）'); };
      xhr.upload.onerror=()=>log.push('✗ upload.onerror（上傳階段失敗）');
      xhr.onload=()=>{ log.push('onload status='+xhr.status); log.push('回應(前200)：'+String(xhr.responseText).slice(0,200)); res({ok:true,uploaded:uploaded,log:log}); };
      xhr.onerror=()=>{ log.push('✗ onerror（讀取回應失敗）'); res({ok:false,uploaded:uploaded,log:log}); };
      xhr.ontimeout=()=>{ log.push('✗ ontimeout'); res({ok:false,uploaded:uploaded,log:log}); };
      xhr.send(blob);
    });
    const verdict='\n\n判讀：'+(putResult.uploaded
      ? '✅ upload.onload 有觸發 → 檔案已上傳成功（即使讀不到回應也算成功，主程式會自動向後端查連結）'
      : '⚠️ upload.onload 未觸發 → 上傳在完成前就中斷（多為網路/代理阻擋實際 PUT）');
    (putResult.uploaded?s2.ok:s2.err)(putResult.log.join('\n')+verdict);

    // ③ resolveFile（依檔名查回連結）
    const s3=addStep('③ 向後端依檔名查回檔案連結 (resolveFile)');
    try{
      const out=await backend({action:'resolveFile',category:'v',fileName:fileName});
      (out.result==='success'?s3.ok:s3.err)(JSON.stringify(out));
    }catch(e){ s3.err(e.name+': '+e.message); }
  }
  document.getElementById('rerun').addEventListener('click',run);
  run();
</script>
</body>
</html>
