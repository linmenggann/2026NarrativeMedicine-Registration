<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名後端連線診斷</title>
<style>
  body{font-family:"Microsoft JhengHei",sans-serif;background:#f3f5f6;color:#22343a;margin:0;padding:20px;line-height:1.7}
  h1{font-size:1.3rem;margin:0 0 6px}
  .sub{color:#5d7178;font-size:.95rem;margin-bottom:16px}
  .env{background:#fff;border:1px solid #e4ebec;border-radius:10px;padding:12px 14px;font-size:.9rem;margin-bottom:16px}
  .step{background:#fff;border:1px solid #e4ebec;border-left:6px solid #bbb;border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .step.run{border-left-color:#c79a3c}
  .step.ok{border-left-color:#0d7d7d;background:#e6f4f4}
  .step.err{border-left-color:#e9694a;background:#fbeae5}
  .step h2{font-size:1.02rem;margin:0 0 6px}
  .step .state{font-weight:800}
  .step pre{white-space:pre-wrap;word-break:break-all;background:#0f1f24;color:#cfe;padding:10px;border-radius:8px;
    font-size:.82rem;margin:8px 0 0;max-height:240px;overflow:auto}
  button{background:#0d7d7d;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1rem;
    font-weight:700;cursor:pointer;margin-bottom:16px}
</style>
</head>
<body>
  <h1>🔌 2026 報名後端連線診斷</h1>
  <div class="sub">此頁僅測試與後端的連線，會把每一步結果顯示在下方。請整頁截圖回傳。</div>
  <div class="env" id="env">環境資訊載入中…</div>
  <button id="rerun">重新測試</button>
  <div id="steps"></div>

<script>
  const URL_EXEC='https://script.google.com/macros/s/AKfycbx0mA3t-XvJ4j-M1zzfoGKnzBC-mMZNK7iuhN4QttUMP5hRsuNmlXxywBTcNmNKl9upWA/exec';
  const stepsEl=document.getElementById('steps');

  document.getElementById('env').textContent =
    '網址：'+location.href+'\n'+
    'protocol：'+location.protocol+'　online：'+navigator.onLine+'\n'+
    'UA：'+navigator.userAgent;

  function addStep(title){
    const d=document.createElement('div'); d.className='step run';
    d.innerHTML='<h2>'+title+'</h2><div class="state">⏳ 測試中…</div><pre></pre>';
    stepsEl.appendChild(d);
    return {
      ok:(t)=>{ d.className='step ok'; d.querySelector('.state').textContent='✅ 成功'; d.querySelector('pre').textContent=t; },
      err:(t)=>{ d.className='step err'; d.querySelector('.state').textContent='❌ 失敗'; d.querySelector('pre').textContent=t; }
    };
  }

  async function run(){
    stepsEl.innerHTML='';

    // 1) fetch GET
    const s1=addStep('① fetch GET（讀取後端是否在線）');
    try{
      const r=await fetch(URL_EXEC,{method:'GET'});
      const t=await r.text();
      s1.ok('HTTP '+r.status+'\n回應：'+t.slice(0,300));
    }catch(e){ s1.err(e.name+': '+e.message); }

    // 2) fetch POST (cors, text/plain)
    const s2=addStep('② fetch POST（送出測試資料，讀取回應）');
    try{
      const r=await fetch(URL_EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({name:'診斷測試-fetch',unit:'教學部',phone:'57440',email:'t@e.com',categories:[],works:{}})});
      const t=await r.text();
      s2.ok('HTTP '+r.status+'\n回應：'+t.slice(0,300));
    }catch(e){ s2.err(e.name+': '+e.message); }

    // 3) XHR POST（觀察 upload 是否完成、能否讀到回應）
    const s3=addStep('③ XHR POST（觀察上傳完成與回應）');
    await new Promise(res=>{
      const log=[]; const xhr=new XMLHttpRequest();
      xhr.open('POST',URL_EXEC,true);
      xhr.timeout=60000;
      xhr.setRequestHeader('Content-Type','text/plain;charset=utf-8');
      xhr.upload.onprogress=ev=>{ if(ev.lengthComputable) log.push('upload progress '+Math.round(ev.loaded/ev.total*100)+'%'); };
      xhr.upload.onload=()=>log.push('upload.onload（上傳完成）');
      xhr.upload.onerror=()=>log.push('upload.onerror（上傳階段失敗）');
      xhr.onload=()=>{ log.push('onload status='+xhr.status); s3.ok(log.join('\n')+'\n回應：'+String(xhr.responseText).slice(0,300)); res(); };
      xhr.onerror=()=>{ log.push('onerror（讀取回應失敗）'); s3.err(log.join('\n')); res(); };
      xhr.ontimeout=()=>{ log.push('ontimeout'); s3.err(log.join('\n')); res(); };
      xhr.send(JSON.stringify({name:'診斷測試-xhr',unit:'教學部',phone:'57440',email:'t@e.com',categories:[],works:{}}));
    });
  }

  document.getElementById('rerun').addEventListener('click',run);
  run();
</script>
</body>
</html>
