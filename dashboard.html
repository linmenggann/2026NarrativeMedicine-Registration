<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 醫院敘事醫學系列競賽｜報名現況儀表板</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --teal:#0d7d7d; --teal-dark:#075c5c; --teal-light:#e6f4f4;
    --coral:#e9694a; --coral-light:#fbeae5; --gold:#c79a3c;
    --ink:#22343a; --muted:#5d7178; --paper:#f3f5f6; --card:#fff; --line:#e4ebec;
    --shadow:0 10px 30px rgba(13,125,125,.10); --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  header.top{background:linear-gradient(135deg,#0d7d7d,#075c5c);color:#fff;padding:26px 0}
  .top-inner{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .top h1{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:800;letter-spacing:.5px}
  .top .sub{color:#cdeaea;font-size:.9rem;margin-top:4px}
  .top .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .updated{font-size:.85rem;color:#cdeaea}
  .btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;
    padding:9px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:.9rem;font-family:inherit;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.28)}

  main{padding:26px 0 60px}
  .state{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
  .state.err{border-color:var(--coral);color:#9c3c25;background:var(--coral-light)}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:880px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 22px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center}
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--teal),var(--coral))}
  .kpi .label{font-size:1.02rem;color:var(--muted);font-weight:700}
  .kpi .num{font-size:clamp(2.6rem,4.4vw,3.4rem);font-weight:900;color:var(--teal-dark);line-height:1.05;margin-top:10px}
  .kpi .ic{font-size:1.4rem}
  .kpi.deadline .num{color:var(--coral)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h2{font-size:1.05rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .panel .hint{font-size:.8rem;color:var(--muted);margin-bottom:16px}

  /* pie / donut chart */
  .pie-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pie{position:relative;width:210px;height:210px;border-radius:50%;flex:0 0 210px;display:grid;place-items:center;box-shadow:var(--shadow)}
  .pie-hole{width:54%;height:54%;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pie-hole b{font-size:1.9rem;font-weight:900;color:var(--ink);line-height:1}
  .pie-hole span{font-size:.78rem;color:var(--muted)}
  .legend{list-style:none;flex:1 1 240px;min-width:220px}
  .legend.multi{column-count:2;column-gap:30px}
  @media(max-width:560px){.legend.multi{column-count:1}}
  .legend li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.98rem;border-bottom:1px dashed var(--line);break-inside:avoid}
  .legend li:last-child{border-bottom:0}
  .legend .sw{width:16px;height:16px;border-radius:5px;flex:0 0 16px}
  .legend .lg-label{font-weight:700;flex:1;word-break:break-all}
  .legend .lg-val{color:var(--muted);white-space:nowrap;font-weight:600}

  .ai-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .ai-card{flex:1 1 200px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 20px;text-align:center}
  .ai-card .t{font-size:1.02rem;color:var(--muted);font-weight:700}
  .ai-card .b{font-size:clamp(2.6rem,5vw,3.2rem);font-weight:900;color:var(--gold);line-height:1.05;margin-top:6px}
  .ai-card small{color:var(--muted);font-size:.92rem}

  .empty{color:var(--muted);font-size:.9rem;padding:10px 0}
  footer{color:var(--muted);font-size:.82rem;text-align:center;padding:8px 0 0}
  .note{background:var(--teal-light);border:1px solid var(--teal);color:var(--teal-dark);
    border-radius:12px;padding:12px 16px;font-size:.84rem;margin-bottom:18px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>📊 報名現況儀表板</h1>
      <div class="sub">2026『醫院敘事醫學系列競賽活動』・ 奇美醫院 教學部</div>
    </div>
    <div class="meta">
      <span class="updated" id="updated">資料載入中…</span>
      <button class="btn" id="refresh">🔄 重新整理</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="content"><div class="state" id="loading">⏳ 正在讀取報名資料…</div></div>

  <footer id="footer"></footer>
</main>

<script src="config.js"></script>
<script>
  // 解析後端網址（與 index.html 相同：?api= → config.js → localStorage）
  function resolveApiUrl(){
    try{ const p=new URLSearchParams(location.search); const v=(p.get('api')||p.get('apps_script_url')||'').trim();
      if(v){ try{localStorage.setItem('APPS_SCRIPT_URL',v);}catch(_){} return v; } }catch(_){}
    if(window.APP_CONFIG && (window.APP_CONFIG.APPS_SCRIPT_URL||'').trim()) return window.APP_CONFIG.APPS_SCRIPT_URL.trim();
    try{ const ls=(localStorage.getItem('APPS_SCRIPT_URL')||'').trim(); if(ls) return ls; }catch(_){}
    return '';
  }
  const API=resolveApiUrl();
  const content=document.getElementById('content');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function daysLeft(deadline){
    const d=Math.ceil((new Date(deadline+'T23:59:59+08:00')-new Date())/86400000);
    return d>0? d : (d===0?0:-1);
  }

  const PALETTE=['#0d7d7d','#e9694a','#c79a3c','#3a86a8','#8a5fb0','#2a9d8f','#e76f51','#457b9d','#bc6c25','#6a994e','#9c6644','#577590'];

  // 圓餅（甜甜圈）圖：中心顯示合計，右側為圖例（含件數與百分比）
  function pie(items, labelKey, valKey, multiCol){
    const total=items.reduce((s,i)=>s+(i[valKey]||0),0);
    if(!total) return '<div class="empty">目前尚無報名資料。</div>';
    let acc=0; const stops=[], legend=[];
    items.forEach((it,idx)=>{
      const val=it[valKey]||0; const start=acc/total*360; acc+=val; const end=acc/total*360;
      const col=PALETTE[idx%PALETTE.length];
      stops.push(`${col} ${start.toFixed(2)}deg ${end.toFixed(2)}deg`);
      legend.push(`<li><span class="sw" style="background:${col}"></span><span class="lg-label">${esc(it[labelKey])}</span><span class="lg-val">${val} 件 ${(val/total*100).toFixed(1)}%</span></li>`);
    });
    return `<div class="pie-wrap">
      <div class="pie" style="background:conic-gradient(${stops.join(',')})"><div class="pie-hole"><b>${total}</b><span>合計</span></div></div>
      <ul class="legend${multiCol?' multi':''}">${legend.join('')}</ul>
    </div>`;
  }

  function render(d){
    const c=d.categories||{}; const v=c.v||{count:0,ai:0}, p=c.p||{count:0,ai:0}, w=c.w||{count:0,ai:0};
    const dl=daysLeft(d.deadline);
    const dlText = dl<0?'已截止':(dl===0?'最後一天':dl+' 天');
    const catItems=[
      {name:'🎬 '+(v.name||'醫療人文短影音'), count:v.count},
      {name:'📷 '+(p.name||'醫療人文攝影'), count:p.count},
      {name:'📖 '+(w.name||'醫療人文敘事醫學徵文'), count:w.count}
    ];
    const units=(d.byUnit||[]).slice(0,12);
    const branches=d.byBranch||[];

    content.innerHTML=`
      <div class="kpis">
        <div class="kpi"><div class="label">📝 總投稿件數</div><div class="num">${(v.count||0)+(p.count||0)+(w.count||0)}</div></div>
        <div class="kpi"><div class="label">🎬 短影音</div><div class="num">${v.count}</div></div>
        <div class="kpi"><div class="label">📷 攝影</div><div class="num">${p.count}</div></div>
        <div class="kpi"><div class="label">📖 徵文</div><div class="num">${w.count}</div></div>
        <div class="kpi deadline"><div class="label">⏳ 距截稿</div><div class="num">${dlText}</div></div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>📊 各類別投稿件數</h2>
          <div class="hint">以件數統計；一人報多類會分別計入各類別件數。</div>
          ${pie(catItems,'name','count',false)}
        </div>
        <div class="panel">
          <h2>🤖 AI 協作件數</h2>
          <div class="hint">影像類（短影音／攝影）以 AI 協助製作之件數，另列特別獎評選。</div>
          <div class="ai-row">
            <div class="ai-card"><div class="t">🎬 短影音 AI 協作</div><div class="b">${v.ai}</div><small>／ ${v.count} 件</small></div>
            <div class="ai-card"><div class="t">📷 攝影 AI 協作</div><div class="b">${p.ai}</div><small>／ ${p.count} 件</small></div>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>🏥 院區分佈</h2>
          <div class="hint">依總表「院區」彙整（以件數計）。</div>
          ${pie(branches,'branch','count',false)}
        </div>
        <div class="panel">
          <h2>🏢 報名單位分佈（前 12）</h2>
          <div class="hint">依總表「服務單位」彙整（以件數計）。</div>
          ${pie(units,'unit','count',true)}
        </div>
      </div>
    `;
    document.getElementById('updated').textContent='更新時間：'+(d.generatedAt||'-');
    document.getElementById('footer').textContent='截稿日期：'+(d.deadline||'-');
  }

  // ===== 主要讀取來源：Google Sheets GViz 端點（快、穩定；直接讀總表並於前端彙整）=====
  const SHEET_ID='1Mh0p8pgsAtkRdTDO7MOjPmr0E3BBsGeb_Q3Jt3M7AKU';
  const MASTER_SHEET='競賽活動報名資料';
  const DEADLINE='2026-07-31';

  function pad(n){ return String(n).padStart(2,'0'); }
  function nowStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }

  async function fetchGviz(){
    const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=1&sheet='+encodeURIComponent(MASTER_SHEET)+'&_='+Date.now();
    const res=await fetch(url);
    if(!res.ok) throw new Error('GViz HTTP '+res.status);
    const text=await res.text();
    // 回應包在 google.visualization.Query.setResponse({...}); 內，取出 JSON 本體
    const start=text.indexOf('{'), end=text.lastIndexOf('}');
    if(start<0||end<0) throw new Error('GViz 回應格式錯誤');
    const obj=JSON.parse(text.slice(start,end+1));
    if(obj.status!=='ok'||!obj.table) throw new Error('GViz 狀態異常');
    return obj.table;
  }

  // 將 GViz 總表資料於前端彙整成與後端 stats 相同的結構
  function aggregate(table){
    const labels=(table.cols||[]).map(c=>String(c.label||'').trim());
    const col=name=>labels.indexOf(name);
    const iBranch=col('院區'), iUnit=col('服務單位');
    const iV=col('短影音-編號'), iP=col('攝影-編號'), iW=col('徵文-編號');
    const iVai=col('短影音-AI協作'), iPai=col('攝影-AI協作');
    const cell=(row,i)=>{ if(i<0) return ''; const c=row.c&&row.c[i]; if(!c) return ''; return String(c.v==null?'':c.v).trim(); };

    const rows=table.rows||[];
    let vC=0,pC=0,wC=0,vAI=0,pAI=0;
    const byUnitMap={}, byBranchMap={};
    rows.forEach(row=>{
      let n=0; // 本筆報名包含的件數（一筆報多類=多件）
      if(cell(row,iV)!==''){ vC++; n++; }
      if(cell(row,iP)!==''){ pC++; n++; }
      if(cell(row,iW)!==''){ wC++; n++; }
      if(cell(row,iVai)==='是') vAI++;
      if(cell(row,iPai)==='是') pAI++;
      const unit=cell(row,iUnit)||'未填'; byUnitMap[unit]=(byUnitMap[unit]||0)+n;
      if(iBranch>=0){ const b=cell(row,iBranch)||'未填'; byBranchMap[b]=(byBranchMap[b]||0)+n; }
    });
    return {
      result:'success', generatedAt:nowStr(), deadline:DEADLINE, total:rows.length,
      categories:{
        v:{name:'醫療人文短影音',count:vC,ai:vAI},
        p:{name:'醫療人文攝影',count:pC,ai:pAI},
        w:{name:'醫療人文敘事醫學徵文',count:wC,ai:0}
      },
      byUnit:Object.keys(byUnitMap).map(u=>({unit:u,count:byUnitMap[u]})).sort((a,b)=>b.count-a.count),
      byBranch:Object.keys(byBranchMap).map(b=>({branch:b,count:byBranchMap[b]})).sort((a,b)=>b.count-a.count)
    };
  }

  async function load(){
    content.innerHTML='<div class="state" id="loading">⏳ 正在讀取報名資料…</div>';
    // 1) 主要：GViz 直讀（快）
    try{
      const table=await fetchGviz();
      render(aggregate(table));
      return;
    }catch(err){
      console.warn('[GViz 讀取失敗，改用 Apps Script 備援]', err);
    }
    // 2) 備援：Apps Script stats 端點
    if(!API){
      content.innerHTML='<div class="state err">⚠️ 讀取失敗，且未設定備援後端網址（config.js 的 APPS_SCRIPT_URL）。</div>';
      return;
    }
    try{
      const url=API+(API.indexOf('?')>=0?'&':'?')+'action=stats';
      const res=await fetch(url,{method:'GET'});
      const data=await res.json();
      if(data && data.result==='success') render(data);
      else throw new Error((data&&data.message)||'資料格式錯誤');
    }catch(err){
      content.innerHTML='<div class="state err">⚠️ 讀取失敗：'+esc(err.message||err)+'<br>請稍後按「重新整理」再試。</div>';
    }
  }

  document.getElementById('refresh').addEventListener('click',load);
  load();
  setInterval(load, 120000); // 每 2 分鐘自動更新
</script>
</body>
</html>
